services:
  - type: web
    name: claimsaathi-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: claimsaathi
      - key: GROQ_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,https://*.vercel.app
